name: integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        owui: ["0.12.5", "0.13.0", "0.13.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ matrix.owui }}-${{ runner.os }}
      - run: pip install uv
      - run: >
          uv pip install --system --index-strategy unsafe-best-match
          --extra-index-url https://download.pytorch.org/whl/cpu
          "open-webui==${{ matrix.owui }}" pytest pytest-asyncio httpx cryptography
      - run: python -m pytest -q tests/integration/test_loader.py -m integration
